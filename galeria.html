<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería - CEIC</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor del Header -->
  <div id="site-header"></div>

  <!-- BANNER PRINCIPAL -->
  <section class="py-5 text-white text-center" style="background-color: #2b5278;">
    <div class="container py-2">
      <h1 class="display-4 fw-bold mb-2">Nuestra Galería</h1>
      <p class="lead mb-0 opacity-90">Conoce nuestras instalaciones y la vida estudiantil en el CEIC</p>
    </div>
  </section>

  <!-- === SECCIÓN DE FOTOS DINÁMICA (CONECTADA A SUPABASE) === -->
  <main class="py-5 bg-light min-vh-100">
    <div class="container">
      <!-- Aquí se inyectarán las tarjetas de las fotos desde Supabase -->
      <div class="row g-4" id="galeria-grid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando galería...</span>
          </div>
          <p class="text-muted mt-2">Cargando imágenes desde Supabase...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- === CONTENEDOR PARA LOS MODALES DINÁMICOS === -->
  <div id="modales-container"></div>

  <!-- Contenedor del Footer -->
  <div id="site-footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SDK de Supabase (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Script Carga Modular y Conexión a Supabase -->
  <script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://fzvjhdeodahtxoolxzkx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6dmpoZGVvZGFodHhvb2x4emt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODc5NjYsImV4cCI6MjEwMzc2Mzk2Nn0.CdAgxnvtMwsv1ryyrqpEdmS8ShqQMLALz5_ZwHsjSHc';
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Cargar componentes estáticos (Header y Footer)
    async function loadComponent(id, file) {
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('No se pudo cargar ' + file);
        const data = await response.text();
        document.getElementById(id).innerHTML = data;

        if (typeof bootstrap !== 'undefined') {
          const dropdowns = document.querySelectorAll('.dropdown-toggle');
          dropdowns.forEach(el => new bootstrap.Dropdown(el));
        }
      } catch (error) {
        console.error(error);
      }
    }

    loadComponent('site-header', 'includes/header.html');
    loadComponent('site-footer', 'includes/footer.html');

    // Función para Cargar la Galería desde Supabase
    async function cargarGaleriaDesdeSupabase() {
      const gridContainer = document.getElementById('galeria-grid');
      const modalesContainer = document.getElementById('modales-container');

      try {
        // Consultamos la tabla "galeria" ordenada por ID o fecha
        const { data: fotos, error } = await _supabase
          .from('galeria')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        // Limpiamos los contenedores
        gridContainer.innerHTML = '';
        modalesContainer.innerHTML = '';

        if (!fotos || fotos.length === 0) {
          gridContainer.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No hay imágenes en la galería todavía.</p></div>';
          return;
        }

        // Recorremos cada registro de la base de datos
        fotos.forEach((foto, index) => {
          const modalId = `imgModal${index + 1}`;
          const titulo = foto.titulo || 'Actividad CEIC';
          const imageUrl = foto.imagen_url;

          // 1. Creamos la tarjeta para el grid
          const cardCol = document.createElement('div');
          cardCol.className = 'col-md-4 col-sm-6';
          cardCol.innerHTML = `
            <div class="card h-100 border-0 shadow-sm overflow-hidden">
              <a href="#" data-bs-toggle="modal" data-bs-target="#${modalId}">
                <img src="${imageUrl}" class="card-img-top img-fluid" alt="${titulo}" style="height: 250px; object-fit: cover;">
              </a>
            </div>
          `;
          gridContainer.appendChild(cardCol);

          // 2. Creamos el modal correspondiente para ver la foto en grande
          const modalDiv = document.createElement('div');
          modalDiv.className = 'modal fade';
          modalDiv.id = modalId;
          modalDiv.tabIndex = '-1';
          modalDiv.setAttribute('aria-hidden', 'true');
          modalDiv.innerHTML = `
            <div class="modal-dialog modal-dialog-centered modal-lg">
              <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 text-center position-relative">
                  <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
                  <img src="${imageUrl}" class="img-fluid rounded shadow" alt="Foto Ampliada">
                </div>
              </div>
            </div>
          `;
          modalesContainer.appendChild(modalDiv);
        });

      } catch (err) {
        console.error('Error al conectar con Supabase:', err.message);
        gridContainer.innerHTML = `
          <div class="col-12 text-center">
            <div class="alert alert-danger" role="alert">
              Hubo un error al cargar las imágenes de la galería. Comprueba tu conexión o las políticas RLS.
            </div>
          </div>`;
      }
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      cargarGaleriaDesdeSupabase();
    });
  </script>
</body>
</html>
