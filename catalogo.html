<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Académico - CEIC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="web.css">
</head>
<body class="bg-light">

    <!-- Navbar Simple o de navegación -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="color: #2b5278;">CEIC · CATÁLOGO</a>
            <div class="ms-auto">
                <a href="inscripcion.html" class="btn btn-sm text-white fw-bold px-3 py-2" style="background-color: #8b263e;">
                    Ir a Inscripción
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: #2b5278;">Oferta Académica Vigente</h1>
            <p class="text-secondary">Conoce nuestros cursos disponibles y forma parte de nuestra institución</p>
        </div>

        <!-- Contenedor dinámico de cursos -->
        <div class="row" id="contenedorCatalogo">
            <div class="col-12 text-center py-5">
                <p class="text-muted">Cargando cursos desde la base de datos...</p>
            </div>
        </div>
    </div>

    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://fzvjhdeodahtxoolxzkx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6dmpoZGVvZGFodHhvb2x4emt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODc5NjYsImV4cCI6MjEwMzc2Mzk2Nn0.CdAgxnvtMwsv1ryyrqpEdmS8ShqQMLALz5_ZwHsjSHc";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarCatalogoPublico() {
            const contenedor = document.getElementById('contenedorCatalogo');
            
            const { data, error } = await supabaseClient.from('cursos').select('*');

            if (error) {
                console.error('Error al cargar catálogo:', error);
                contenedor.innerHTML = '<p class="text-danger text-center">No se pudo cargar el catálogo en este momento.</p>';
                return;
            }

            if (!data || data.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-muted">No hay cursos registrados actualmente.</p>';
                return;
            }

            contenedor.innerHTML = '';
            
            data.forEach(curso => {
                contenedor.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-0" style="border-radius: 12px; overflow: hidden;">
                            <div class="card-body d-flex flex-column">
                                <h4 class="card-title fw-bold mb-3" style="color: #2b5278;">${curso.nombre}</h4>
                                <p class="card-text text-secondary flex-grow-1">${curso.descripcion || 'Sin descripción detallada.'}</p>
                                
                                <ul class="list-unstyled small text-muted mb-4 bg-light p-3 rounded">
                                    <li><strong>Modalidad:</strong> ${curso.modalidad || 'No especificada'}</li>
                                    <li><strong>Costo:</strong> $${curso.costo || '0.00'}</li>
                                    <li><strong>Cupos Máximos:</strong> ${curso.cupo_maximo || 'No especificado'}</li>
                                    <li><strong>Culminación:</strong> ${curso.fecha_culminacion || 'Por definir'}</li>
                                </ul>

                                <a href="inscripcion.html" class="btn text-white fw-bold w-100 py-2" style="background-color: #8b263e; border-radius: 8px;">
                                    Inscribirse al Curso
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = cargarCatalogoPublico;
    </script>
</body>
</html>
