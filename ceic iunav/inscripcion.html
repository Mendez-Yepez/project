<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Admin · CEIC</title>
<style>
  :root[data-theme="dark"]{
    --bg-gradient: linear-gradient(135deg,#0d131a 0%,#1e2b3a 50%,#0d131a 100%);
    --primary-blue:#2b547e; --primary-blue-light:#3d6b9e; --accent-red:#800000;
    --panel-bg: rgba(22,30,39,0.72); --panel-border: rgba(255,255,255,0.12);
    --row-hover: rgba(255,255,255,0.05); --input-bg: rgba(255,255,255,0.07);
    --text-main:#ffffff; --text-muted:#cbd5e1; --text-faint:#8fa1b3;
    --sidebar-bg: rgba(13,19,26,0.75); --chip-bg: rgba(43,84,126,0.35);
    --divider: rgba(255,255,255,0.08); --ficha-bg:#ffffff; --ficha-text:#1a1a1a;
  }
  :root[data-theme="light"]{
    --bg-gradient: linear-gradient(135deg,#e2e8f0 0%,#cbd5e1 50%,#94a3b8 100%);
    --primary-blue:#2b547e; --primary-blue-light:#3d6b9e; --accent-red:#800000;
    --panel-bg: rgba(255,255,255,0.72); --panel-border: rgba(255,255,255,0.5);
    --row-hover: rgba(43,84,126,0.06); --input-bg: rgba(0,0,0,0.04);
    --text-main:#0f172a; --text-muted:#475569; --text-faint:#64748b;
    --sidebar-bg: rgba(255,255,255,0.6); --chip-bg: rgba(43,84,126,0.12);
    --divider: rgba(0,0,0,0.08); --ficha-bg:#ffffff; --ficha-text:#1a1a1a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  html,body{height:100%;}
  body{
    background:var(--bg-gradient); color:var(--text-main); min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:0.9rem 1.4rem; padding-top:calc(0.9rem + env(safe-area-inset-top,0px));
    background:var(--sidebar-bg); backdrop-filter:blur(14px); border-bottom:1px solid var(--panel-border);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:0.7rem;}
  .brand .seal{width:38px; height:38px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .brand .seal svg{width:100%; height:100%;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-size:1rem; font-weight:700;}
  .brand-text .role{font-size:0.75rem; color:var(--text-faint);}
  .top-actions{display:flex; align-items:center; gap:0.6rem;}
  .icon-btn{
    background:var(--input-bg); border:1px solid var(--panel-border); color:var(--text-main);
    width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{transform:scale(1.05);}
  .admin-pill{
    display:flex; align-items:center; gap:0.5rem; background:var(--chip-bg); border:1px solid var(--panel-border);
    padding:0.35rem 0.8rem 0.35rem 0.4rem; border-radius:999px; font-size:0.82rem; color:var(--text-muted);
  }
  .admin-pill .dot{width:8px; height:8px; border-radius:50%; background:#3fae5c;}

  .layout{display:flex; min-height:calc(100vh - 66px);}

  .sidebar{
    width:250px; flex-shrink:0; background:var(--sidebar-bg); backdrop-filter:blur(14px);
    border-right:1px solid var(--panel-border); padding:1.2rem 0.9rem;
  }
  .sidebar h3{font-size:0.72rem; letter-spacing:0.04em; color:var(--text-faint); font-weight:600; margin:0.4rem 0.6rem 0.7rem;}
  .course-item{
    display:flex; flex-direction:column; gap:0.15rem; padding:0.65rem 0.75rem; border-radius:10px;
    cursor:pointer; margin-bottom:0.3rem; border:1px solid transparent;
  }
  .course-item:hover{background:var(--row-hover);}
  .course-item.active{background:var(--chip-bg); border-color:var(--panel-border);}
  .course-item .cname{font-size:0.92rem; font-weight:600;}
  .course-item .ccount{font-size:0.76rem; color:var(--text-faint);}

  .main{flex:1; padding:1.4rem 1.6rem 2.5rem; min-width:0;}
  .main-header{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap;}
  .main-header h1{font-size:1.5rem; font-weight:700;}
  .main-header p{color:var(--text-faint); font-size:0.85rem; margin-top:0.2rem;}
  .search-box{
    display:flex; align-items:center; gap:0.5rem; background:var(--input-bg); border:1px solid var(--panel-border);
    border-radius:8px; padding:0.5rem 0.8rem; min-width:220px;
  }
  .search-box input{background:none; border:none; outline:none; color:var(--text-main); font-size:0.88rem; width:100%;}
  .search-box input::placeholder{color:var(--text-faint);}

  .panel{
    background:var(--panel-bg); backdrop-filter:blur(14px); border:1px solid var(--panel-border);
    border-radius:14px; overflow:hidden;
  }
  table{width:100%; border-collapse:collapse; font-size:0.87rem;}
  thead th{
    text-align:left; font-weight:600; color:var(--text-faint); font-size:0.74rem; letter-spacing:0.03em;
    padding:0.8rem 1rem; border-bottom:1px solid var(--divider);
  }
  tbody td{padding:0.75rem 1rem; border-bottom:1px solid var(--divider); color:var(--text-main);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--row-hover);}
  .stu-name{font-weight:600;}
  .stu-sub{font-size:0.76rem; color:var(--text-faint);}
  .badge{
    display:inline-block; padding:0.2rem 0.6rem; border-radius:999px; font-size:0.72rem; font-weight:600;
    background:var(--chip-bg); color:var(--text-muted);
  }
  .row-actions{display:flex; gap:0.4rem; justify-content:flex-end;}
  .ficha-btn{
    background:var(--primary-blue); color:#fff; border:none; border-radius:7px; padding:0.4rem 0.75rem;
    font-size:0.78rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .ficha-btn:hover{background:var(--primary-blue-light);}

  .stats-row{display:flex; gap:0.8rem; margin-bottom:1.1rem; flex-wrap:wrap;}
  .stat{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px; padding:0.8rem 1.1rem;
    min-width:130px; backdrop-filter:blur(14px);
  }
  .stat .num{font-size:1.4rem; font-weight:700; font-family:Georgia,serif;}
  .stat .lbl{font-size:0.74rem; color:var(--text-faint); margin-top:0.1rem;}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:center; justify-content:center;
    padding:1rem; z-index:50;
  }
  .overlay.show{display:flex;}
  
  /* Estilos institucionales para la Ficha */
  .ficha{
    background:var(--ficha-bg); color:var(--ficha-text); width:100%; max-width:760px; border-radius:8px;
    padding:1.4rem; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.4); max-height:92vh; overflow-y:auto;
  }
  .ficha-close{
    position:absolute; top:0.8rem; right:0.8rem; background:rgba(0,0,0,0.08); border:none; width:30px; height:30px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#1a1a1a; font-weight:bold;
  }
  .ficha-head{display:flex; align-items:center; gap:0.8rem; border-bottom:2px solid var(--primary-blue); padding-bottom:0.7rem; margin-bottom:0.9rem;}
  .ficha-head .seal{width:46px; height:46px; border-radius:50%; background:#fff; flex-shrink:0; overflow:hidden;}
  .ficha-head .seal svg{width:100%; height:100%;}
  .ficha-head .titles{line-height:1.2;}
  .ficha-head .titles .t1{font-family:Georgia,serif; font-weight:700; font-size:1rem;}
  .ficha-head .titles .t2{font-size:0.68rem; color:#555; letter-spacing:0.02em;}

  /* Tablas de la Ficha estilo institucional */
  .ficha-table{width:100%; border-collapse:collapse; font-size:0.8rem; margin-bottom:0.8rem; border:1px solid #b5b5b5;}
  .ficha-table th.section-header{
    background:#555b61; color:#ffffff; text-align:left; padding:0.45rem 0.7rem;
    font-size:0.82rem; font-weight:600; letter-spacing:0.02em;
  }
  .ficha-table td{border:1px solid #d2d2d2; padding:0.4rem 0.6rem; vertical-align:top;}
  .ficha-cell-label{font-size:0.68rem; color:#555; text-transform:uppercase; font-weight:600; margin-bottom:0.1rem;}
  .ficha-cell-val{font-size:0.84rem; color:#111; font-weight:500;}
  
  .ficha-photo-cell{text-align:center; vertical-align:middle; background:#f0f2f5; width:135px;}
  .ficha-photo{width:105px; height:130px; object-fit:cover; border:1px solid #bbb; background:#e0e0e0; display:inline-block; border-radius:4px;}

  .ficha-actions{display:flex; gap:0.6rem; margin-top:1rem;}
  .ficha-actions button{flex:1; padding:0.55rem; border-radius:6px; font-size:0.85rem; font-weight:600; cursor:pointer; border:none;}
  .btn-print{background:var(--primary-blue); color:#fff;}
  .btn-cancel{background:rgba(0,0,0,0.1); color:#1a1a1a;}

  .empty{padding:2.5rem 1rem; text-align:center; color:var(--text-faint); font-size:0.9rem;}

  @media (max-width: 760px){
    .layout{flex-direction:column;}
    .sidebar{width:100%; border-right:none; border-bottom:1px solid var(--panel-border); display:flex; gap:0.5rem; overflow-x:auto; padding:0.9rem;}
    .sidebar h3{display:none;}
    .course-item{flex-shrink:0; min-width:160px;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{padding:0.8rem 1rem; border-bottom:1px solid var(--divider);}
    tbody td{border:none; padding:0.15rem 0;}
    .row-actions{justify-content:flex-start; margin-top:0.5rem;}
  }

  @media print{
    body *{visibility:hidden;}
    .ficha, .ficha *{visibility:visible;}
    .ficha{position:fixed; inset:0; margin:auto; box-shadow:none; border-radius:0; width:100%; max-width:none;}
    .ficha-close, .ficha-actions{display:none;}
    .overlay{background:#fff;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="seal" id="sealSlot1"></div>
    <div class="brand-text">
      <div class="name">CEIC · Panel Administrativo</div>
      <div class="role">Centro Educativo Integral Comunitario</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="admin-pill"><span class="dot"></span><span id="adminLabel">admin</span></div>
    <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <h3>Cursos</h3>
    <div id="courseList"></div>
  </aside>

  <main class="main">
    <div class="stats-row" id="statsRow"></div>

    <div class="main-header">
      <div>
        <h1 id="courseTitle">Curso</h1>
        <p id="courseSub">Alumnos inscritos</p>
      </div>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Buscar alumno...">
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Alumno</th>
            <th>N° Identificación</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="studentBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">No se encontraron alumnos con ese criterio.</div>
    </div>
  </main>
</div>

<div class="overlay" id="fichaOverlay">
  <div class="ficha" id="fichaCard">
    <button class="ficha-close" id="fichaClose">✕</button>
    <div class="ficha-head">
      <div class="seal" id="sealSlot2"></div>
      <div class="titles">
        <div class="t1">Ficha del Estudiante</div>
        <div class="t2">CENTRO EDUCATIVO INTEGRAL COMUNITARIO</div>
      </div>
    </div>
    <div id="fichaFields"></div>
    <div class="ficha-actions">
      <button class="btn-cancel" id="fichaCancelBtn">Cerrar</button>
      <button class="btn-print" id="fichaPrintBtn">Imprimir / Guardar PDF</button>
    </div>
  </div>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
