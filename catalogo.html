<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas de Cursos y Profesores</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="catalogo.css">

</head>
<body>

  <div class="container max-w-6xl">
    
    <!-- Filtros y Búsqueda -->
    <div class="filter-card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-6 position-relative">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
          <input type="text" id="searchInput" class="form-control search-input" placeholder="Buscar por curso, código o profesor...">
        </div>
        <div class="col-md-3">
          <select id="categorySelect" class="form-select rounded-3">
            <option value="todos">Todas las áreas</option>
            <option value="Estética">Estética y Salud</option>
            <option value="Oficios">Técnicos y Oficios</option>
            <option value="Gastronomía">Gastronomía</option>
          </select>
        </div>
        <div class="col-md-3 text-md-end text-muted small">
          <span id="courseCount">6</span> Cursos disponibles
        </div>
      </div>
    </div>

    <!-- Contenedor de Fichas -->
    <div class="row g-4" id="coursesGrid">
      <!-- Se genera dinámicamente -->
    </div>

  </div>

  <!-- JavaScript -->
  <script>
    // Listado de cursos solicitado
    const cursos = [
      {
        codigo: "UNA-101",
        Curso: "Esculpido y Estética de Uñas",
        categoria: "Estética",
        horario: "Lun y Mié • 09:00 AM - 12:00 PM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Valeria Morales",
          titulo: "Especialista en Nail Art",
          email: "vmorales@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=150&q=80"
        }
      },
      {
        codigo: "HER-201",
        titulo: "Herrería y Soldadura Estructural",
        carrera: "Módulo Técnico • Oficios",
        categoria: "Oficios",
        horario: "Mar y Jue • 02:00 PM - 05:00 PM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Ing. Roberto Méndez",
          titulo: "Maestro Herrero",
          email: "rmendez@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80"
        }
      },
      {
        codigo: "COC-102",
        titulo: "Cocina Internacional y Gastronomía",
        carrera: "Módulo Técnico • Gastronomía",
        categoria: "Gastronomía",
        horario: "Sábados • 08:00 AM - 01:00 PM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Chef Fernando Silva",
          titulo: "Gastrónomo Principal",
          email: "fsilva@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80"
        }
      },
      {
        codigo: "REP-202",
        titulo: "Repostería y Pastelería Fina",
        carrera: "Módulo Técnico • Gastronomía",
        categoria: "Gastronomía",
        horario: "Viernes • 01:00 PM - 05:00 PM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Chef Camila Rivas",
          titulo: "Maestra Pastelera",
          email: "crivas@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=150&q=80"
        }
      },
      {
        codigo: "MAS-301",
        titulo: "Masoterapia y Terapia Corporal",
        carrera: "Módulo Técnico • Salud",
        categoria: "Estética",
        horario: "Lun y Mié • 02:00 PM - 05:00 PM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Lic. Andrea Colmenares",
          titulo: "Fisioterapeuta",
          email: "acolmenares@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
        }
      },
      {
        codigo: "MEC-401",
        titulo: "Mecánica Dental y Prótesis",
        carrera: "Módulo Técnico • Salud Dental",
        categoria: "Oficios",
        horario: "Mar y Jue • 08:00 AM - 11:00 AM",
        modalidad: "Presencial",
        banner: "https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=600&q=80",
        profesor: {
          nombre: "Dr. Gustavo Salazar",
          titulo: "Técnico Dental",
          email: "gsalazar@capacitacion.edu",
          foto: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=150&q=80"
        }
      }
    ];

    // Función para renderizar las fichas
    function renderCourses(data) {
      const grid = document.getElementById('coursesGrid');
      document.getElementById('courseCount').textContent = data.length;

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <p class="text-muted mt-2">No se encontraron cursos que coincidan con la búsqueda.</p>
          </div>`;
        return;
      }

      grid.innerHTML = data.map(curso => `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="course-card">
            <!-- Portada / Banner -->
            <div class="card-banner" style="background-image: url('${curso.banner}');">
              <span class="badge-code">${curso.codigo}</span>
              <span class="badge-mode">${curso.modalidad}</span>
            </div>

            <!-- Contenido del Curso -->
            <div class="card-body-content">
              <h3 class="course-title">${curso.titulo}</h3>
              <div class="course-subtitle">${curso.carrera}</div>
              
              <div class="course-schedule">
                <i class="bi bi-clock"></i>
                <span>${curso.horario}</span>
              </div>

              <!-- Ficha del Profesor -->
              <div class="teacher-box">
                <img src="${curso.profesor.foto}" alt="${curso.profesor.nombre}" class="teacher-avatar">
                <div class="teacher-info">
                  <div class="teacher-role">${curso.profesor.titulo}</div>
                  <div class="teacher-name">${curso.profesor.nombre}</div>
                  <span class="teacher-email">${curso.profesor.email}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Filtrado en tiempo real
    function filterCourses() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const catVal = document.getElementById('categorySelect').value;

      const filtered = cursos.filter(c => {
        const matchesSearch = c.titulo.toLowerCase().includes(searchVal) ||
                              c.codigo.toLowerCase().includes(searchVal) ||
                              c.profesor.nombre.toLowerCase().includes(searchVal);
        
        const matchesCat = catVal === 'todos' || c.categoria === catVal;

        return matchesSearch && matchesCat;
      });

      renderCourses(filtered);
    }

    // Escuchadores de eventos
    document.getElementById('searchInput').addEventListener('input', filterCourses);
    document.getElementById('categorySelect').addEventListener('change', filterCourses);

    // Render inicial
    renderCourses(cursos);
  </script>
</body>
</html>
